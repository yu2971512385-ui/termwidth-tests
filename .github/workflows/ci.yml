name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Validate vectors.json
        run: python validate.py

  runners:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Go
        working-directory: runners/go
        run: go run .

      - name: Python
        working-directory: runners/python
        run: |
          pip install rich wcwidth
          python run.py

      - name: Node
        working-directory: runners/node
        run: |
          npm install
          node run.mjs

      - name: Rust
        working-directory: runners/rust
        run: cargo run
